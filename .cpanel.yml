---
deployment:
  tasks:
    # ── 1. Detect PHP binary ──────────────────────────────────────────────────
    - |
      PHP_BIN="/opt/alt/php84/usr/bin/php"
      [ -f "$PHP_BIN" ] || PHP_BIN=$(which php 2>/dev/null || echo "php")
      echo "[deploy] PHP: $("$PHP_BIN" -r 'echo PHP_VERSION;' 2>/dev/null)"

    # ── 2. Save .env before git reset ────────────────────────────────────────
    - |
      if [ -f "$PWD/.env" ]; then
        cp "$PWD/.env" "$PWD/../.env.mapelead"
        echo "[deploy] .env saved"
      fi

    # ── 3. Clear ALL caches BEFORE code lands (prevents stale-cache 500s) ────
    - |
      PHP_BIN="/opt/alt/php84/usr/bin/php"
      [ -f "$PHP_BIN" ] || PHP_BIN=$(which php 2>/dev/null || echo "php")
      "$PHP_BIN" "$PWD/artisan" optimize:clear 2>/dev/null || {
        rm -f "$PWD/bootstrap/cache"/*.php 2>/dev/null || true
        find "$PWD/storage/framework/views" -name "*.php" -delete 2>/dev/null || true
        echo "[deploy] Caches cleared manually"
      }

    # ── 4. Restore .env after git reset ──────────────────────────────────────
    - |
      if [ ! -f "$PWD/.env" ] && [ -f "$PWD/../.env.mapelead" ]; then
        cp "$PWD/../.env.mapelead" "$PWD/.env"
        echo "[deploy] .env restored"
      fi

    # ── 5. Composer install ───────────────────────────────────────────────────
    - |
      PHP_BIN="/opt/alt/php84/usr/bin/php"
      [ -f "$PHP_BIN" ] || PHP_BIN=$(which php 2>/dev/null || echo "php")
      COMPOSER=""
      for c in "$HOME/composer.phar" "$HOME/bin/composer" "$(which composer 2>/dev/null)"; do
        [ -f "$c" ] && COMPOSER="$c" && break
      done
      if [ -n "$COMPOSER" ] && [ -f "$PHP_BIN" ]; then
        "$PHP_BIN" "$COMPOSER" install --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-scripts 2>&1 | tail -3
        echo "[deploy] Composer install complete"
      elif [ -d "$PWD/vendor" ]; then
        echo "[deploy] WARNING: Composer not found, using existing vendor/"
      else
        echo "[deploy] ERROR: No composer and no vendor/. Deployment may be broken."
      fi

    # ── 6. Storage & permissions ──────────────────────────────────────────────
    - |
      PHP_BIN="/opt/alt/php84/usr/bin/php"
      [ -f "$PHP_BIN" ] || PHP_BIN=$(which php 2>/dev/null || echo "php")
      chmod -R 755 "$PWD/storage" "$PWD/bootstrap/cache" 2>/dev/null || true
      "$PHP_BIN" "$PWD/artisan" storage:link --force 2>/dev/null || true

    # ── 7. Migrate ────────────────────────────────────────────────────────────
    - |
      PHP_BIN="/opt/alt/php84/usr/bin/php"
      [ -f "$PHP_BIN" ] || PHP_BIN=$(which php 2>/dev/null || echo "php")
      [ -f "$PWD/.env" ] && "$PHP_BIN" "$PWD/artisan" migrate --force 2>&1 || echo "[deploy] Skipped migrations (no .env)"

    # ── 8. Rebuild caches AFTER new code ─────────────────────────────────────
    - |
      PHP_BIN="/opt/alt/php84/usr/bin/php"
      [ -f "$PHP_BIN" ] || PHP_BIN=$(which php 2>/dev/null || echo "php")
      if [ -f "$PWD/.env" ]; then
        "$PHP_BIN" "$PWD/artisan" config:cache 2>&1
        "$PHP_BIN" "$PWD/artisan" route:cache  2>&1
        "$PHP_BIN" "$PWD/artisan" view:cache   2>&1
        echo "[deploy] All caches rebuilt"
      fi

    # ── 9. Health check ───────────────────────────────────────────────────────
    - |
      PHP_BIN="/opt/alt/php84/usr/bin/php"
      [ -f "$PHP_BIN" ] || PHP_BIN=$(which php 2>/dev/null || echo "php")
      "$PHP_BIN" "$PWD/artisan" app:health 2>&1 || echo "[deploy] WARNING: health check failed — review logs"
