---
deployment:
  tasks:
    # ── Restore .env from safe backup (stored one level up, outside git) ──────
    - |
      if [ ! -f "$PWD/.env" ] && [ -f "$PWD/../.env.mapelead" ]; then
        cp "$PWD/../.env.mapelead" "$PWD/.env"
        echo "[deploy] .env restored from backup"
      fi

    # ── Install/update Composer dependencies ──────────────────────────────────
    - |
      PHP_BIN="/opt/alt/php84/usr/bin/php"
      if [ ! -f "$PHP_BIN" ]; then PHP_BIN=$(which php 2>/dev/null || echo "php"); fi

      COMPOSER_BIN="$HOME/composer.phar"
      if [ ! -f "$COMPOSER_BIN" ]; then COMPOSER_BIN=$(which composer 2>/dev/null || echo ""); fi

      if [ -n "$COMPOSER_BIN" ] && [ -f "$PHP_BIN" ]; then
        "$PHP_BIN" "$COMPOSER_BIN" install --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-scripts 2>&1
        echo "[deploy] Composer install complete"
      elif [ -d "$PWD/vendor" ]; then
        echo "[deploy] WARNING: Composer not found, using existing vendor/"
      else
        echo "[deploy] ERROR: No composer and no vendor/. Deployment may be broken."
      fi

    # ── Backup .env after git pull (so next deploy can restore it) ────────────
    - |
      if [ -f "$PWD/.env" ]; then
        cp "$PWD/.env" "$PWD/../.env.mapelead"
        echo "[deploy] .env backed up to parent directory"
      fi

    # ── Set storage/cache permissions ─────────────────────────────────────────
    - chmod -R 755 "$PWD/storage" "$PWD/bootstrap/cache" 2>/dev/null || true

    # ── Create storage symlink ─────────────────────────────────────────────────
    - |
      PHP_BIN="/opt/alt/php84/usr/bin/php"
      if [ ! -f "$PHP_BIN" ]; then PHP_BIN=$(which php 2>/dev/null || echo "php"); fi
      "$PHP_BIN" "$PWD/artisan" storage:link --force 2>/dev/null || true

    # ── Run migrations (only new ones — safe) ─────────────────────────────────
    - |
      PHP_BIN="/opt/alt/php84/usr/bin/php"
      if [ ! -f "$PHP_BIN" ]; then PHP_BIN=$(which php 2>/dev/null || echo "php"); fi
      if [ -f "$PWD/.env" ]; then
        "$PHP_BIN" "$PWD/artisan" migrate --force 2>&1 || echo "[deploy] Migration warning (may be ok)"
      else
        echo "[deploy] Skipping migrations — no .env found"
      fi

    # ── Clear old caches, rebuild ──────────────────────────────────────────────
    - |
      PHP_BIN="/opt/alt/php84/usr/bin/php"
      if [ ! -f "$PHP_BIN" ]; then PHP_BIN=$(which php 2>/dev/null || echo "php"); fi
      if [ -f "$PWD/.env" ]; then
        "$PHP_BIN" "$PWD/artisan" config:cache  2>&1 || true
        "$PHP_BIN" "$PWD/artisan" route:cache   2>&1 || true
        "$PHP_BIN" "$PWD/artisan" view:cache    2>&1 || true
        echo "[deploy] Caches rebuilt"
      fi
